dataset: Sim_Demand_Design_Vector_PCAOnly_IV
# The demand benchmark's estimator and recipe (configs/Sim_Demand_Design_IV.yaml)
# applied to the Vector DGP with the scalar S replaced by a frozen k-dim PCA of
# the 784-dim proxy, fitted on the training proxy only. 
output_dir: "."
save_res: False
save_model: True
use_gpu: True
binary_treatment: False
use_bnn: False
n_samples: [1000,5000,10000]
rho: [0.5]
n_repeat: 20
vector_dim: 784
v_dim: 785
feature_seed: 42
test_vector_seed: 42
representation_sd: 0.5
pca_dim: 6
fit_epochs: 200
fit_epochs_per_eval: 10
fit_batch_size: 64
fit_egm_n_iter: 50000
fit_egm_batches_per_eval: 500
# In paper, we did ten warm starts: every start runs EGM and BGM; the start with the smallest
# training-set IV-moment residual is the one model every structural readout is reported from.
egm_num_warm_starts: 10
fit_first_stage_warmup_epochs: 0
# Latent partition [z0 shared, z1 outcome-only, z2 treatment-only, z3 decoder-only].
z_dims: [3,2,1,2]
lr_theta: 0.0001
lr_z: 0.0001
g_units: [64,64,64,64,64]
f_units: [64,32,8]
h_units: [64,32,8]
e_units: [64,64,64,64,64]
dz_units: [64,32,8]
kl_weight: 0.0001
lr: 0.0002
g_d_freq: 5
use_z_rec: True
iv_mc_samples: 1000
eval_mc_samples: 1000
structural_map_steps: 1000
structural_map_lr: 0.0001
# outcome->particle coupling gamma: particles are updated from (v, x, w) only.
outcome_to_particles_weight: 0.01
# Learned covariate noise sigma_v (no fixed floor); outcome noise uses a soft
# floor sigma_y = 0.1 + softplus(.) so the mixture outcome likelihood cannot
# degenerate.
sigma_y_softfloor: 0.1
deterministic_training: true
training_grid_monitor: false
# --- structural evaluation --------------------------------------------------
# Pilot readouts; MCMC is run later on the selected setting only.
structural_methods: [map, encoder]
mcmc_family: demand
mcmc_num_chains: 4
mcmc_production_warmup_steps: 2000
mcmc_production_draws: 5000
