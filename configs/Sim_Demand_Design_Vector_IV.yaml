dataset: Sim_Demand_Design_Vector_IV
output_dir: "."
save_res: False
save_model: True
use_gpu: True
binary_treatment: False
use_bnn: False
n_samples: [1000,5000,10000]
rho: [0.1,0.25,0.5,0.75,0.9]
n_repeat: 20
representation_sd: 0.5
fit_epochs: 200
fit_epochs_per_eval: 10
fit_batch_size: 32
fit_egm_n_iter: 50000
fit_egm_batches_per_eval: 500
# Ten EGM initializations are scored only with the deterministic full-training
# EGM outcome loss.  A single member of the three best-scoring starts is drawn
# by the fixed, manifest-seeded relative-loss softmax selector and is the only
# start continued through BGM.
egm_num_warm_starts: 10
egm_selection_top_k: 3
fit_first_stage_warmup_epochs: 0
z_dims: [2,1,1,2]
lr_theta: 0.0001
lr_z: 0.0001
g_units: [64,64,64,64,64]
f_units: [64,32,8]
h_units: [64,32,8]
e_units: [64,64,64,64,64]
dz_units: [64,32,8]
kl_weight: 0.0001
lr: 0.0002
g_d_freq: 5
use_z_rec: True
iv_mc_samples: 1000
eval_mc_samples: 1000
structural_map_steps: 1000
structural_map_lr: 0.0001
# --- vector recipe -----------------------------------------------------------
# Covariate blocks are fixed to event-sum in code for training and inference.
# outcome->particle coupling gamma, selected by the training-side held-out
# criterion (held-out train-split instrument-moment MSE, seed-median argmin
# over {0, 0.1, 0.25, 0.5, 1})
outcome_to_particles_weight: 0.25
# soft variance floor on the 1-d time head: sigma = 0.1 + learned_sd
sigma_time_softfloor: 0.1
# bit-level reproducibility contract (same GPU model); seeds run_seed
deterministic_training: true
# no test-grid metric is computed during training (grid-blind training)
training_grid_monitor: false
# --- structural evaluation --------------------------------------------------
# map / encoder are point readouts; mcmc is the full-grid posterior integral.
structural_methods: [map, encoder, mcmc]
mcmc_family: vector
